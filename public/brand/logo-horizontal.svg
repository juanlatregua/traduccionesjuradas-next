<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">

  <!-- TRADUCCIONESJURADAS.NET — Logo final -->
  <!-- Colores WCAG AA: Dorado #B8922A · Azul #3D6FA8 -->

  <!-- Banner fondo dorado -->
  <rect x="0" y="0" width="600" height="200" rx="20" fill="#B8922A"/>

  <!-- Franja .net inferior -->
  <path d="M0,158 L600,158 L600,180 Q600,200 580,200 L20,200 Q0,200 0,180 Z"
    fill="rgba(0,0,0,0.18)"/>
  <line x1="16" y1="158" x2="584" y2="158" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="300" y="186" text-anchor="middle"
    font-family="-apple-system, 'Segoe UI', sans-serif"
    font-size="28" font-weight="800"
    letter-spacing="-0.5"
    fill="white">.net</text>

  <!-- Símbolo TJ — T blanca + arco azul formando D -->
  <line x1="40"  y1="36"  x2="160" y2="36"  stroke="white"   stroke-width="16" stroke-linecap="round"/>
  <line x1="76"  y1="36"  x2="76"  y2="142" stroke="white"   stroke-width="16" stroke-linecap="round"/>
  <line x1="76"  y1="142" x2="160" y2="142" stroke="#3D6FA8" stroke-width="16" stroke-linecap="round"/>
  <path d="M160,36 Q230,36 230,89 Q230,142 160,142"
    fill="none" stroke="#3D6FA8" stroke-width="16" stroke-linecap="round"/>
  <circle cx="76" cy="89" r="9"   fill="#B8922A"/>
  <circle cx="76" cy="89" r="5.5" fill="white"/>

  <!-- Wordmark -->
  <text x="256" y="72"
    font-family="-apple-system, 'Segoe UI', sans-serif"
    font-size="30" font-weight="700"
    fill="white" letter-spacing="-0.3">TRADUCCIONES</text>
  <text x="256" y="108"
    font-family="-apple-system, 'Segoe UI', sans-serif"
    font-size="30" font-weight="700"
    fill="white" letter-spacing="-0.3">JURADAS</text>

  <!-- Tagline -->
  <text x="257" y="138"
    font-family="-apple-system, 'Segoe UI', sans-serif"
    font-size="11" font-weight="400"
    letter-spacing="2.2"
    fill="rgba(255,255,255,0.55)">traducción oficial certificada · españa</text>

