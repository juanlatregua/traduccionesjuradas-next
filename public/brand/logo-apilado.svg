<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" role="img" aria-label="Traducciones Juradas — Logo apilado">
  <title>Traducciones Juradas — Logo apilado</title>
  <defs>
    <style>
      .navy { fill: #1B2A41; }
      .teal { fill: #0F6B66; }
      .muted { fill: #6C7A89; }
      .label { font-family: Merriweather, Georgia, 'Times New Roman', serif; font-weight: 700; letter-spacing: .5px; }
      .ui { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    </style>
  </defs>

  <g transform="translate(160,20)">
    
  <title>Traducciones Juradas — Isotipo</title>
  <defs>
    <style>
      .navy { fill: #1B2A41; }
      .teal { fill: #0F6B66; }
      .line { stroke: #1B2A41; stroke-width: 8; stroke-linecap: round; opacity: .85; }
      .paper { fill: #FFFFFF; }
      .cut { fill: #FFFFFF; opacity: .95; }
    </style>
  </defs>

  <!-- Shield -->
  <path class="navy" d="M100 18
    C136 18 160 30 174 44
    V98
    C174 142 146 170 100 186
    C54 170 26 142 26 98
    V44
    C40 30 64 18 100 18 Z" />

  <!-- Paper with folded corner -->
  <path class="paper" d="M70 52 H122 L140 70 V126
    C140 131 136 135 131 135 H70
    C65 135 61 131 61 126 V61
    C61 56 65 52 70 52 Z" />
  <path class="cut" d="M122 52 V70 H140" />

  <!-- Paper lines -->
  <line class="line" x1="76" y1="82" x2="122" y2="82"/>
  <line class="line" x1="76" y1="100" x2="122" y2="100"/>
  <line class="line" x1="76" y1="118" x2="108" y2="118"/>

  <!-- Check (badge) -->
  <circle class="teal" cx="135" cy="124" r="26"/>
  <path d="M124 124 L132 132 L147 113" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  </g>

  <text x="260" y="310" text-anchor="middle" class="navy label" font-size="72">TRADUCCIONES</text>
  <text x="260" y="388" text-anchor="middle" class="navy label" font-size="72">JURADAS</text>

  <rect x="110" y="415" width="300" height="4" rx="2" fill="#1B2A41" opacity="0.25"/>
  <text x="260" y="470" text-anchor="middle" class="muted ui" font-size="30" font-weight="600" letter-spacing="1.5">NOMBRADO POR EL MAEC</text>
</svg>
